<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unpaste.ai Email Signature</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px; background: #f4f4f4; }
  .install-note { max-width: 480px; margin: 0 auto 24px auto; padding: 16px 20px; background: #fff; border-left: 4px solid #DC2626; font-size: 13px; color: #333; line-height: 1.5; }
  .install-note h2 { margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  .install-note ol { margin: 0; padding-left: 20px; }
  .signature-frame { max-width: 480px; margin: 0 auto; padding: 24px; background: #fff; }
</style>
</head>
<body>

<div class="install-note">
  <h2>Install in Gmail</h2>
  <ol>
    <li>Select everything inside the white box below.</li>
    <li>Copy (Cmd+C).</li>
    <li>Gmail &rarr; Settings (gear) &rarr; See all settings &rarr; Signature.</li>
    <li>Paste into the signature editor and Save Changes at the bottom.</li>
  </ol>
</div>

<!-- ============================================ -->
<!-- SIGNATURE STARTS HERE - select inside frame  -->
<!-- ============================================ -->
<div class="signature-frame">

<table cellpadding="0" cellspacing="0" border="0" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #09090B; line-height: 1.4;">
  <tr>
    <td style="padding: 0;">
      <div style="font-size: 15px; font-weight: 700; color: #09090B; letter-spacing: -0.01em;">Elliot Stone</div>
      <div style="font-size: 13px; color: #71717A; margin-top: 2px;">Founder, Unpaste.ai</div>
      <div style="font-size: 13px; margin-top: 6px;">
        <a href="https://unpaste.ai" style="color: #09090B; text-decoration: none; border-bottom: 1px solid #E4E4E7;">unpaste.ai</a>
      </div>
      <div style="font-size: 13px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #E4E4E7;">
        <a href="https://unpaste.ai/training" style="color: #DC2626; text-decoration: none; font-weight: 600; font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; letter-spacing: 0.02em;">Book in-person AI training &rarr;</a>
      </div>
    </td>
  </tr>
</table>

</div>
<!-- ============================================ -->
<!-- SIGNATURE ENDS HERE                          -->
<!-- ============================================ -->

</body>
</html>
