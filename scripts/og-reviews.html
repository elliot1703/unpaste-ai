<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-reviews</title>
<!--
  Source of client/public/images/og-reviews.png, the Open Graph image for /reviews (1200 x 630).
  The rating and count are typed in here, so re-render whenever GOOGLE_RATING in
  client/src/lib/reviews.ts changes: open this file in Chrome at exactly 1200 x 630 and screenshot
  it, or run Playwright against it (viewport 1200 x 630, deviceScaleFactor 1, wait for
  document.fonts.ready). Fonts load from Google Fonts, so render while online.
  Brand: tokens from the site stylesheet, zero radius, hard offset shadow, one red accent.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --background: #FAFAFA; --foreground: #09090B; --primary: #DC2626; --border: #E4E4E7; --muted: #71717A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--background); color: var(--foreground); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(90deg, var(--border) 1px, transparent 1px), linear-gradient(180deg, var(--border) 1px, transparent 1px); background-size: 60px 60px; opacity: .6; }
  .wordmark { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; font-family: "Space Mono", monospace; font-weight: 700; font-size: 22px; letter-spacing: .05em; }
  .wordmark i { display: block; width: 30px; height: 30px; background: var(--primary); }
  .tag { position: absolute; right: 72px; top: 70px; font-family: "Space Mono", monospace; font-size: 16px; letter-spacing: .12em; color: var(--primary); }
  .card { position: absolute; left: 72px; top: 150px; width: 1056px; height: 330px; background: var(--background); border: 2px solid var(--foreground); box-shadow: 12px 12px 0 0 var(--foreground); display: flex; align-items: center; padding: 0 56px; gap: 56px; }
  .score { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-weight: 800; font-size: 280px; letter-spacing: -.06em; line-height: .9; }
  .right { display: flex; flex-direction: column; gap: 22px; }
  .stars { display: flex; gap: 10px; color: var(--primary); }
  .stars svg { width: 58px; height: 58px; fill: currentColor; }
  .from { font-family: "Space Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.2; }
  .public { font-family: "Space Mono", monospace; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .line { position: absolute; left: 72px; bottom: 58px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .url { position: absolute; right: 72px; bottom: 62px; font-family: "Space Mono", monospace; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wordmark"><i></i>UNPASTE</div>
  <div class="tag">[GOOGLE REVIEWS]</div>
  <div class="card">
    <div class="score">5.0</div>
    <div class="right">
      <div class="stars" aria-label="5 out of 5 stars">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div class="from">From 5 Google reviews</div>
      <div class="public">Every one of them public</div>
    </div>
  </div>
  <div class="line">Workshops, 1:1 training, team days. Brisbane.</div>
  <div class="url">unpaste.ai/reviews</div>
</body>
</html>
